name = "moser_tardos"
version = "0.1.0"
defaultTargets = ["PseudorandomLib", "MoserTardos", "Challenge", "Solution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "PseudorandomLib"
globs = ["PseudorandomLib.+"]

[[lean_lib]]
name = "MoserTardos"
globs = ["MoserTardos.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
